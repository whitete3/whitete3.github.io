title: "Predicting Ethereum Price using Bitcoin"

short_summary: >
 Using simple regression models to predict price and volatility of Etheruem based on Etheruem and Bitcoin historical data

tech_stack:
  - Python
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - Jupyter Notebooks

problem_statement: >
  This project investigates whether the price of Ethereum can be predicted using the price of Bitcoin, given their strong market correlation despite different underlying purposes. It also explores how Bitcoin-related public sentiment and market events influence broader cryptocurrency price dynamics, using historical data and modeling techniques to better understand these relationships.

approach: >
  The model uses curve fit and a polynomial with a highest degree 4 that takes price data from Bitcoin and predicts the  estimated price curve of Ethereum. It has 4 coeffient parameters and one x variable that represents the Bitcoin price data. I chose this model because it was simplistic, but had enough terms to be able to get a good prediction of the price. To measure accuracy I use the RMSE of my model. I will not predict a future price because that requires an assumption of Bitcoin's future price.

results_impact: >
  I learned that Ethereum is greatly impacted by sentiments towards and market events around Bitcoin, which is a clear relationship when looking at the correlation to their prices and match times of steep increases in price to succesfull  moments in Bitcoin's price. I encountered a challenge preparing the data to plot the prices of both currencies and discovered solution to make sure the datasets match. I found that, you can predict the price of Ethereum by the prices of Bitcoin, just not with great accuracy due to a large dataset (831 RMSE)

